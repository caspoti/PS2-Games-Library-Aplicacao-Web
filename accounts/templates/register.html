{% extends "base.html" %}

{% block content %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            
            {{ user_form.username.errors }} <!-- Mostra o erro do campo -->
            <label>Usuário: </label>
            {{ user_form.username }}

        </div>

        <div class="form-group">

            {{ user_form.password1.errors }} <!-- Mostra o erro do campo -->
            <label>Senha: </label>
            {{ user_form.password1 }}

        </div>

        <div class="form-group">

            {{ user_form.password2.errors }} <!-- Mostra o erro do campo -->
            <label>Confirme a senha: </label>
            {{ user_form.password2 }}


        </div>

        <div class="form-group">

            <input type="submit" value="Cadastrar">

        </div>
    </form>


{% endblock %}

<!-- Para aparece o o formulario completo usa-se: 
    <form method="post">
        {% csrf_token %}

        {{ user_form.as_p }}

        <input type="submit" value="Cadastrar">
    </form>  -->

<!-- Nesse html isolamos cada item do formulario usando <div class="form-group"></div> -->
